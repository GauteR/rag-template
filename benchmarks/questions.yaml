# Benchmark questions
#
# Each entry defines a question that will be posed to every model profile.
# Questions are tuned for the hash embedder used in default CI/live runs.
#
# Seed fixtures first:
#   python benchmarks/seed_index.py

questions:
  - id: q1
    question: Install the template with uv sync
    expected_node_ids:
      - install:n1

  - id: q2
    question: FAISS persists vectors under INDEX_DIR
    expected_node_ids:
      - vectorstores:n2

  - id: q3
    question: Stage 1 broad vector recall retrieves candidate nodes
    expected_node_ids:
      - query_pipeline:n2
