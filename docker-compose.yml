services:
  rag-api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INDEX_DIR: /data/index
      VECTOR_STORE_PROVIDER: faiss
    ports:
      - "8000:8000"
    volumes:
      - rag_index:/data/index

  chroma:
    profiles: [chroma]
    image: chromadb/chroma:1.5.8
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma

  rag-api-chroma:
    profiles: [chroma]
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      INDEX_DIR: /data/index
      VECTOR_STORE_PROVIDER: chroma
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
    ports:
      - "8000:8000"
    volumes:
      - rag_index:/data/index
    depends_on:
      - chroma

volumes:
  rag_index:
  chroma_data:
