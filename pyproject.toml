[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-template"
version = "0.1.0"
description = "Generic Proxy-Pointer RAG FastAPI template"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "python-multipart>=0.0.27",
    "pypdf>=6.15.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pyyaml>=6.0",
    "ruff>=0.5",
    "import-linter>=2.0",
    "rank-bm25>=0.2.2",
    "pre-commit>=4.0",
]
faiss = ["faiss-cpu>=1.8"]
chroma = ["chromadb>=1.5.9"]
hybrid = ["rank-bm25>=0.2.2"]
llamaparse = ["llama-cloud-services>=0.6"]
mcp = ["mcp>=1.0"]

[tool.uv]
override-dependencies = [
    "aiohttp>=3.14.0",
    "banks>=2.4.2",
    "idna>=3.15",
    "starlette>=1.0.1",
    "urllib3>=2.7.0",
]

[tool.setuptools.packages.find]
include = ["app*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=app --cov=core --cov-report=term-missing:skip-covered"
markers = [
    "live_models: tests that call live LLM or embedding providers",
]

[tool.coverage.run]
omit = ["tests/*", "benchmarks/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.importlinter]
root_packages = ["core", "app"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Domain layer is independent of outer layers and framework libs"
type = "forbidden"
source_modules = ["core.domain"]
forbidden_modules = [
    "core.application",
    "core.infrastructure",
    "core.config",
    "app",
    "fastapi",
    "faiss",
    "httpx",
    "pydantic_settings",
]

[[tool.importlinter.contracts]]
name = "Application layer does not import infrastructure or presentation"
type = "forbidden"
source_modules = ["core.application"]
forbidden_modules = [
    "core.infrastructure",
    "app",
]
